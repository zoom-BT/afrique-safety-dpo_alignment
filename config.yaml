# Global defaults for this topic's DPO training/evaluation runs.
# See the Week 4 proposal (in the llm-alignment-internship vault) for the full
# research design — this file only tracks the hyperparameters that come from it.

paths:
  output_dir: results/
  cache_dir: .cache/

model:
  base_model_name: "McGill-NLP/AfriqueQwen3.5-4B-50Langs"  # M1, the target CPT backbone (B1/B2/B4)
  # M2, the control backbone (B3): "Qwen/Qwen3.5-4B-Base" -- override base_model_name to this for that baseline
  # The compliance judge deliberately runs on the CONTROL backbone, not the target one.
  # A judge sharing a backbone with the agent it scores would favour that agent, and H2
  # compares a Qwen-Base agent against an AfriqueQwen agent -- so an AfriqueQwen judge would
  # inflate exactly the effect being claimed. Building it on Qwen-Base makes any
  # backbone-affinity bias work against the hypothesis. See D8.
  judge_model_name: "Qwen/Qwen3.5-4B-Base"

training:
  seed: 42
  precision: bf16
  full_finetune: false
  load_in_4bit: true  # QLoRA: 4-bit NF4 base weights + full-precision LoRA adapters (proposal section 10, E3)
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    # PEFT has no default target-module map for `qwen3_5` and raises rather than guessing,
    # which is what made the first smoke-test DPO run fail. Attention projections plus the
    # MLP, the usual LoRA surface for a Qwen decoder. Check against a real checkpoint with
    # src.train.list_lora_candidates before changing these -- names that match nothing
    # attach adapters to nothing and train silently at zero effect.
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # Measured with the real tokenizer and the real chat template, twice, because the first
  # measurement was of the wrong task. Generation pairs (policy + opening turn + one
  # response) peak at 1,570 tokens. The *guardian* task embeds the whole transcript and
  # peaks at 2,060 -- so 2048 truncates one example, and left only three tokens of margin
  # before the template's special tokens were counted at all. Truncating here would cut the
  # verdict off the end of the sequence, which is the entire training signal.
  # 2560 truncates nothing on either task, with real headroom.
  max_seq_length: 2560
  logging_backend: tensorboard

dpo:
  # Built locally by src/data.py from UbuntuGuard's released test JSONL, not pulled from
  # the Hub -- point this at the file to use. The NLLB-translated counterfactual the
  # proposal called for is no longer on the critical path: the headline claim was recentred
  # from H1 (native vs. translated) to H2 (does the CPT backbone retain alignment better?),
  # which varies the backbone over a single dataset. See the vault's
  # Week5_Deviations_From_Proposal.md, D6.
  ubuntuguard_path: "data/Ubuntu_guard_test_crosslingual.jsonl"
  dataset_name: null
  # Which HHH axis to train on: "honest", "harmless", or null for all themes.
  # The study trains on honest and evaluates on both -- harmless-only leaves 216 training
  # pairs across ten languages, which is not a study. See the vault's
  # Week5_Deviations_From_Proposal.md, D9.
  axis: honest
  # Three disjoint base_stem slices: the compliance judge and the aligned agent are trained
  # on the same corpus, so they must not share questions, and neither may have seen the
  # evaluation set. On the guardian task this gives 461 / 1373 / 473. See D8.
  eval_fraction: 0.2
  judge_fraction: 0.25
  # UbuntuGuard ships no training split (confirmed via full repo git history, not just a
  # stale README) -- self-carved a language-stratified 80/20 row_id split of the released
  # test data instead. Pairing every PASS against every FAIL within a row_id, without ever
  # reusing a response, yields 1,089 usable pairs -> 868 train / 221 eval. Supersedes the
  # earlier 401/100 figure, which came from counting only row_ids holding exactly one PASS
  # and one FAIL and so discarded roughly half the corpus.
  train_size: 868
  eval_size: 221
  beta: 0.1  # KL penalty strength against the frozen reference model; literature default, not yet tuned for this task
  learning_rate: 5.0e-6  # proposal section 10, E3
  warmup_ratio: 0.03
  num_epochs: 3  # proposal section 10, E3
  eval_steps: 20
  batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true

wandb:
  project: afrique-safety-dpo
  mode: online
