# Global defaults for this topic's DPO training/evaluation runs.
# See the Week 4 proposal (in the llm-alignment-internship vault) for the full
# research design — this file only tracks the hyperparameters that come from it.

paths:
  output_dir: results/
  cache_dir: .cache/

model:
  base_model_name: "McGill-NLP/AfriqueQwen3.5-4B-50Langs"  # M1, the target CPT backbone (B1/B2/B4)
  # M2, the control backbone (B3): "Qwen/Qwen3.5-4B-Base" -- override base_model_name to this for that baseline

training:
  seed: 42
  precision: bf16
  full_finetune: false
  load_in_4bit: true  # QLoRA: 4-bit NF4 base weights + full-precision LoRA adapters (proposal section 10, E3)
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
  # Measured, not guessed: with the AfriqueQwen tokenizer the formatted pairs run to a
  # median of 819 tokens and a maximum of 1570 (the safety policy alone is ~2,700 chars of
  # the prompt). 1024 would silently truncate 13.8% of examples -- and truncating a DPO
  # response destroys the very preference signal being trained on. 2048 truncates none.
  max_seq_length: 2048
  logging_backend: tensorboard

dpo:
  # Built locally by src/data.py from UbuntuGuard's released test JSONL, not pulled from
  # the Hub -- point this at the file to use. The NLLB-translated counterfactual the
  # proposal called for is no longer on the critical path: the headline claim was recentred
  # from H1 (native vs. translated) to H2 (does the CPT backbone retain alignment better?),
  # which varies the backbone over a single dataset. See the vault's
  # Week5_Deviations_From_Proposal.md, D6.
  ubuntuguard_path: "data/Ubuntu_guard_test_crosslingual.jsonl"
  dataset_name: null
  # UbuntuGuard ships no training split (confirmed via full repo git history, not just a
  # stale README) -- self-carved a language-stratified 80/20 row_id split of the released
  # test data instead. Pairing every PASS against every FAIL within a row_id, without ever
  # reusing a response, yields 1,089 usable pairs -> 868 train / 221 eval. Supersedes the
  # earlier 401/100 figure, which came from counting only row_ids holding exactly one PASS
  # and one FAIL and so discarded roughly half the corpus.
  train_size: 868
  eval_size: 221
  beta: 0.1  # KL penalty strength against the frozen reference model; literature default, not yet tuned for this task
  learning_rate: 5.0e-6  # proposal section 10, E3
  warmup_ratio: 0.03
  num_epochs: 3  # proposal section 10, E3
  eval_steps: 20
  batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true

wandb:
  project: afrique-safety-dpo
  mode: online
